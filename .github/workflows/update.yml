name: update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Restore state from the data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: state

      - run: mkdir -p state && rm -rf state/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            .argos
            .hf
          key: models-${{ hashFiles('config/sources.yaml') }}
          restore-keys: models-

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]"

      - name: Test
        run: |
          python -m pytest -q
          node --test site/tests/*.test.mjs

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run --state state --out build/data

      - name: Save state to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Assemble site
        run: |
          cp -r site/index.html site/style.css site/app.js site/lib.js site/map.js \
                site/manifest.webmanifest site/icon.svg site/icon-180.png site/icon-512.png \
                site/map site/vendor build/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY" || true
