name: update

on:
  # Main trigger: cron-job.org calls workflow_dispatch every 10 minutes (on time, unlike
  # GitHub's scheduler). This hourly schedule is only a backup if that service stops.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4

      - name: Restore state from the data branch
        run: |
          mkdir -p state
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch -q --depth=1 origin data
            git --work-tree=state checkout FETCH_HEAD -- .
            git reset -q
          elif [ "$code" -eq 2 ]; then
            echo "No data branch yet: starting with empty state."
          else
            echo "Could not reach the data branch (exit $code); refusing to start from empty state."
            exit 1
          fi

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Restore Python environment
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Restore models
        uses: actions/cache/restore@v4
        with:
          path: |
            .argos
            .hf
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Install (only when the environment is not cached)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -q -e ".[ml]"

      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install models
        id: models
        run: |
          python scripts/install_models.py
          echo "fp=$(find .argos .hf -type f -printf '%P %s\n' 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save models (only when the set changed)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .argos
            .hf
          key: models-${{ steps.models.outputs.fp }}

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run --state state --out build/data

      - name: Save state to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Assemble site
        run: |
          cp -r site/index.html site/style.css site/app.js site/lib.js site/map.js \
                site/manifest.webmanifest site/icon.svg site/icon-180.png site/icon-512.png \
                site/map site/vendor build/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY" || true
