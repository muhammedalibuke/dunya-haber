[project]
name = "dunya-haber"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "geonamescache>=2.0",
  "babel>=2.14",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",
  "argostranslate>=1.9",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
